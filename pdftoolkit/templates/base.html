<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PDF 工具箱{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
          --accent:#2563eb; --hl:#fde68a; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --card:#1e2128; --text:#e6e6e6; --muted:#9aa0aa; --line:#2e323b;
            --accent:#6ea8ff; --hl:#7a5d00; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  form.search { display:flex; gap:8px; flex-wrap:wrap; margin: 16px 0 8px; }
  input[type=text] { flex:1 1 260px; padding:10px 12px; font-size:16px; border:1px solid var(--line);
         border-radius:8px; background:var(--card); color:var(--text); }
  input.small { flex:0 1 200px; font-size:14px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  label.opt { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .doc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
         margin:12px 0; }
  .doc h2 { font-size:15px; margin:0; word-break:break-all; }
  .doc h2 a { color:var(--accent); text-decoration:none; }
  .hit { display:flex; gap:12px; padding:6px 0; border-top:1px dashed var(--line); }
  .hit:first-of-type { border-top:0; }
  .pg { flex:0 0 52px; font-size:13px; }
  .pg a { color:var(--muted); }
  .snip { flex:1; word-break:break-word; }
  mark { background:var(--hl); color:inherit; padding:0 1px; border-radius:2px; }
  details { margin-top: 20px; background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding: 10px 16px; }
  summary { cursor:pointer; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; align-items:center; }
  progress { width:100%; height:10px; }
  .err { color: var(--err); }
  code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  header .in { max-width:1040px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:24px; }
  header .brand { font-weight:700; font-size:16px; padding:14px 0; }
  nav { display:flex; gap:4px; }
  nav a { padding:14px 12px; color:var(--muted); text-decoration:none; border-bottom:2px solid transparent; }
  nav a.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin:14px 0; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .tile b { display:block; font-size:22px; }
  .tile span { color:var(--muted); font-size:13px; }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; margin:12px 0; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; padding:0 8px; border-radius:10px; font-size:12px; white-space:nowrap; }
  .tag.ok { background:#dcfce7; color:#166534; }
  .tag.review { background:#ffedd5; color:#9a3412; }
  .tag.error { background:#fee2e2; color:#991b1b; }
  .tag.hint { background:#e0e7ff; color:#3730a3; }
  @media (prefers-color-scheme: dark) {
    .tag.ok { background:#14532d; color:#bbf7d0; } .tag.review { background:#7c2d12; color:#fed7aa; }
    .tag.error { background:#7f1d1d; color:#fecaca; } .tag.hint { background:#312e81; color:#c7d2fe; }
  }
  a.button { display:inline-block; padding:10px 16px; border-radius:8px; background:var(--accent);
             color:#fff; text-decoration:none; }
</style>
</head>
<body>
<header><div class="in">
  <div class="brand">PDF 工具箱</div>
  <nav>
    <a href="/" class="{{ 'on' if tab == 'search' }}">关键词搜索</a>
    <a href="/invoices" class="{{ 'on' if tab == 'invoices' }}">发票转 Excel</a>
  </nav>
</div></header>
<main>
{% block content %}{% endblock %}
</main>
<script>
// shared: send a folder path or picked PDFs to `base` (+ "/upload"), then poll `base`/status
async function startFolder(base, extra) {
  const folder = document.getElementById('folder').value.trim();
  if (!folder) return null;
  const r = await fetch(base === '/invoices' ? '/invoices/run' : base,
                        {method: 'POST', body: new URLSearchParams({folder, ...extra})});
  return r.json();
}
async function startUpload(base, inputId, extra, say) {
  const pdfs = [...document.getElementById(inputId).files]
    .filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if (!pdfs.length) { say('没有选中 PDF 文件'); return null; }
  const fd = new FormData();
  pdfs.forEach(f => fd.append('files', f, f.webkitRelativePath || f.name));
  Object.entries(extra || {}).forEach(([k, v]) => fd.append(k, v));
  say(`正在上传 ${pdfs.length} 个文件…`);
  return (await fetch(base + '/upload', {method: 'POST', body: fd})).json();
}
async function poll(base, onProgress, onDone) {
  const s = await (await fetch(base + '/status')).json();
  if (s.running) { onProgress(s); setTimeout(() => poll(base, onProgress, onDone), 600); }
  else if (s.report) onDone(s.report);
}
function esc(x) {
  return String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
{% block script %}{% endblock %}
</body>
</html>
